<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Welcome</title>
</head>
<body style="margin:0; padding:0; background-color:#f4f4f7; font-family: Arial, Helvetica, sans-serif;">

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f7; padding: 30px 0;">
    <tr>
        <td align="center">

            <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="background-color:#ffffff; border-radius:8px; overflow:hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.08);">

                <!-- Header -->
                <tr>
                    <td style="background-color:#4CAF50; padding: 24px 40px;">
                        <h1 style="color:#ffffff; margin:0; font-size:22px;">Welcome Aboard! 🎉</h1>
                    </td>
                </tr>

                <!-- Body -->
                <tr>
                    <td style="padding: 32px 40px;">
                        <p style="font-size:16px; color:#333333; margin-top:0;">
                            Hi <span th:text="${username}">User</span>,
                        </p>

                        <p style="font-size:16px; color:#333333; line-height:1.6;">
                            Thanks for signing up! We're excited to have you on board.
                        </p>

                        <p style="font-size:16px; color:#333333; line-height:1.6;">
                            Your account email: <strong th:text="${email}">email@example.com</strong>
                        </p>

                        <p style="font-size:14px; color:#666666; margin-top: 16px;">
                            From: <span th:text="${from}">noreply@mts.com</span>
                        </p>

                        <p style="font-size:14px; color:#999999; margin-top: 24px;">
                            If you didn't create this account, you can safely ignore this email.
                        </p>
                    </td>
                </tr>

                <!-- Footer -->
                <tr>
                    <td style="background-color:#f4f4f7; padding: 20px 40px; text-align:center;">
                        <p style="font-size:12px; color:#aaaaaa; margin:0;">
                            &copy; <span th:text="${#dates.year(#dates.createNow())}">2026</span> YourApp. All rights reserved.
                        </p>
                    </td>
                </tr>

            </table>

        </td>
    </tr>
</table>

</body>
</html>
